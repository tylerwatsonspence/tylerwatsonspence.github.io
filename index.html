<!DOCTYPE html>
<html lang="en-us">
    <head>  
        <meta charset="utf-8">
        <title> Programming Black Practical </title>
        <style>
            html {
                font-family: Helvetica, Arial, sans-serif;
                font-size: 10px;
            }
            header {
                background-color: burlywood;
                text-align: center;
            }
            h2 {
                font-size: 2rem;
            }

            ul,ol,dl,p {
                font-size: 1.5rem;
            }

            li, p {
                line-height: 1.5;
            }

      /* Unordered list styles */

            ul {
                padding-left: 2rem;
                list-style-type: none;
            }

            ul li {
                padding-left: 2rem;
                background-image: url(star.svg);
                background-position: 0 0;
                background-size: 1.6rem 1.6rem;
                background-repeat: no-repeat;
            }

            th,td {
                border: 1px solid grey;
                
            }
            th {
                background-color: darkolivegreen;
                color: white;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Prog Black Practical</h1>
            <h2>Topic: Darlington</h2>
            <p> My Hometown</p>
        </header>
        <main>
            <img src = "darlington.png">
            <h2>
                Places to go:
            </h2>
            <ul>
                <li>Town Centre</li>
                <li>South Park</li>
                <li>My House</li>
            </ul>
            <p> Here is the link to the Darlington wikipedia page to learn more <a href = "https://en.wikipedia.org/wiki/Darlington">Wikipedia</a><p>

            <p> Here is how far other places are from Darlington: </p>
            <table>
                <thead>
                    <th scope="col">Place</th>
                    <th scope="col">Distance</th>
                </thead>
                <tbody>
                    <tr>
                        <td scope="row">Newcastle</td>
                        <td scope="row">31 miles</td>
                    </tr>
                    <tr> 
                        <td scope="row">York</td>
                        <td scope="row">43 miles</td>
                    </tr>
                </tbody>
            </table>  
        </main>
    </body>
